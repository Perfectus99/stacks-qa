name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: typecheck, lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  stack:
    name: the stack starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the system under test
        run: docker compose up -d --wait
      - name: It answers on /health
        run: |
          curl --fail --silent --show-error http://localhost:3100/health | tee /dev/stderr | grep -q '"database":"connected"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  suite:
    name: api suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the system under test
        run: docker compose up -d --wait
      # The gate lives in suites/regression/package.json, not here: npm eats
      # flags forwarded through a nested workspace script, and `--grep-invert
      # @pending` silently became `playwright test @pending` — the exact
      # inverse of the intent, passing locally and running one test in CI.
      - name: Run the suite
        run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: suites/regression/playwright-report
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
