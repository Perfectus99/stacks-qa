name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: typecheck, lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  stack:
    name: the stack starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the system under test
        run: docker compose up -d --wait
      - name: It answers on /health
        run: |
          curl --fail --silent --show-error http://localhost:3100/health | tee /dev/stderr | grep -q '"database":"connected"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  suite:
    name: api suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the system under test
        run: docker compose up -d --wait
      # The gate lives in suites/regression/package.json, not here: npm eats
      # flags forwarded through a nested workspace script, and `--grep-invert
      # @pending` silently became `playwright test @pending` — the exact
      # inverse of the intent, passing locally and running one test in CI.
      - name: Run the suite
        run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: suites/regression/playwright-report
          retention-days: 14
      # Only from main: the published report should describe what is released,
      # not whatever a branch happened to be trying.
      - name: Package the report for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: suites/regression/playwright-report
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  publish:
    name: publish the report
    needs: suite
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
