services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stacks
      POSTGRES_PASSWORD: stacks
      POSTGRES_DB: stacks
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacks -d stacks"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/demo-api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://stacks:stacks@database:5432/stacks
      JWT_SECRET: development-only-secret
    ports:
      - "3100:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
